services:
  hvv-collector:
    build:
      context: .
      network: host
    image: hvv-gti:latest
    container_name: hvv-collector
    restart: unless-stopped
    # Host-Netzwerk, damit INFLUX_URL=http://localhost:8086 wie ausserhalb von Docker funktioniert.
    network_mode: host
    env_file: .env
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
