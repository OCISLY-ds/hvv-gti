services:
  hvv-collector:
    build:
      context: .
      network: host
    image: hvv-gti:latest
    container_name: hvv-collector
    restart: unless-stopped
    # Host-Netzwerk, damit INFLUX_URL=http://localhost:8086 wie ausserhalb von Docker funktioniert.
    network_mode: host
    env_file: .env
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Routenplaner (Port 8090, Startseite) mit Adress-, Haltestellen- und Standortsuche, Linien-Logos in data/icons (werden auch in
  # Grafana unter /public/img/hvv eingebunden). Die Live-Karte (interpolierte S-/U-Bahnen, Basiskarte aus map/data/hamburg.pmtiles)
  # ist aus; einschalten mit "--live-map" im command, sie liegt dann unter /live.html.
  hvv-map:
    build:
      context: .
      network: host
    image: hvv-gti:latest
    container_name: hvv-map
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    env_file: .env
    # X-Busse sind auf der Karte standardmaessig dabei (im Browser abschaltbar), "--no-xbus" laesst sie ganz weg
    command: ["serve-map", "--port", "8090"]
    volumes:
      - ./data:/app/data
      - ./map/data:/app/map/data
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # HTTPS fuer den Routenplaner: https://hvv-api.duckdns.org:12140 (Fritzbox leitet 12140/12141 auf den Pi). Zertifikat von Let's Encrypt
  # per DNS-01 ueber DuckDNS (DUCKDNS_TOKEN in .env), siehe deploy/traefik/. Veroeffentlicht wird nur der Routenplaner (127.0.0.1:8090).
  hvv-proxy:
    image: traefik:v3.2
    container_name: hvv-proxy
    restart: unless-stopped
    network_mode: host
    environment:
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
    volumes:
      - ./deploy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./deploy/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./data/traefik:/acme
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, DAC_OVERRIDE]  # DAC_OVERRIDE: acme.json im Projektordner (Besitzer florian) schreiben
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
