services:
  hvv-collector:
    build:
      context: .
      network: host
    image: hvv-gti:latest
    container_name: hvv-collector
    restart: unless-stopped
    # Host-Netzwerk, damit INFLUX_URL=http://localhost:8086 wie ausserhalb von Docker funktioniert.
    network_mode: host
    env_file: .env
    # Spool-Senke (HVV_SINKS=spool oder influx,spool): die Dateien liegen in ./data/spool, der Shipper (Profil "ship") schickt sie per GitHub weiter
    user: "1000:1000"
    volumes:
      - ./data:/app/data
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Schickt die gesammelten Messdaten alle HVV_SHIP_INTERVAL Sekunden (Standard 6 h) als Paket in ein privates GitHub-Release
  # (GITHUB_REPO, GITHUB_TOKEN in .env). Start: docker compose --profile ship up -d hvv-shipper. Siehe MIGRATION.md.
  hvv-shipper:
    profiles: ["ship"]
    build:
      context: .
      network: host
    image: hvv-gti:latest
    container_name: hvv-shipper
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    env_file: .env
    command: ["ship"]
    volumes:
      - ./data:/app/data
    mem_limit: 96m
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"

  # Routenplaner (Port 8090, Startseite) mit Adress-, Haltestellen- und Standortsuche, Linien-Logos in data/icons (werden auch in
  # Grafana unter /public/img/hvv eingebunden). Die Live-Karte (interpolierte S-/U-Bahnen, Basiskarte aus map/data/hamburg.pmtiles)
  # ist aus; einschalten mit "--live-map" im command, sie liegt dann unter /live.html.
  hvv-map:
    build:
      context: .
      network: host
    image: hvv-gti:latest
    container_name: hvv-map
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    env_file: .env
    # X-Busse sind auf der Karte standardmaessig dabei (im Browser abschaltbar), "--no-xbus" laesst sie ganz weg
    command: ["serve-map", "--port", "8090"]
    volumes:
      - ./data:/app/data
      - ./map/data:/app/map/data
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # HTTPS fuer den Routenplaner: https://hvv-api.duckdns.org:12140 (Fritzbox leitet 12140/12141 auf den Pi). Zertifikat von Let's Encrypt
  # per DNS-01 ueber DuckDNS (DUCKDNS_TOKEN in .env), siehe deploy/traefik/. Veroeffentlicht wird nur der Routenplaner (127.0.0.1:8090).
  hvv-proxy:
    image: traefik:v3.2
    container_name: hvv-proxy
    restart: unless-stopped
    network_mode: host
    environment:
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
    volumes:
      - ./deploy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./deploy/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./data/traefik:/acme
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, DAC_OVERRIDE]  # DAC_OVERRIDE: acme.json im Projektordner (Besitzer florian) schreiben
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Cloudflare Tunnel: ausgehende Verbindung zu Cloudflare, damit der Planer unter https://<eigene Domain> ohne Port und ohne
  # Fritzbox-Freigabe erreichbar ist. Startet nur mit dem Profil "tunnel" und TUNNEL_TOKEN in .env (Einrichtung: docs/cloudflare-tunnel.md).
  # Im Cloudflare-Dashboard zeigt der Public Hostname auf http://127.0.0.1:8090 (Host-Netz).
  hvv-tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: hvv-tunnel
    restart: unless-stopped
    network_mode: host
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Wegwerf-Datenbank fuer die Tests der TimescaleDB-Anbindung (nur mit --profile dbtest; Port 5544 nur lokal)
  hvv-dbtest:
    profiles: ["dbtest"]
    image: timescale/timescaledb:latest-pg16
    container_name: hvv-dbtest
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: hvv
      NO_TS_TUNE: "true"  # der Pi-Kernel kennt keine Speichergrenzen, das Tuning-Werkzeug stuerzt sonst ab
    ports:
      - "127.0.0.1:5544:5432"
    mem_limit: 300m
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30", "-c", "work_mem=8MB", "-c", "timescaledb.telemetry_level=off"]
    volumes:
      - dbtest-data:/var/lib/postgresql/data  # auf Platte, nicht tmpfs: die Testdaten (ein Monat HVV-Historie) sind mehrere hundert MB gross

volumes:
  dbtest-data:
