apiVersion: 1
datasources:
  - name: HVV TimescaleDB
    uid: hvv-timescale
    type: grafana-postgresql-datasource
    access: proxy
    url: timescaledb:5432
    user: hvv_ro
    isDefault: true
    secureJsonData:
      password: $HVV_RO_PASSWORD
    jsonData:
      database: hvv
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
      maxOpenConns: 10
