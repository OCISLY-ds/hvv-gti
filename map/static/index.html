<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f6f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1b1d" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Routenplaner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>HVV Routenplaner</title>
<script>try{var t=localStorage.getItem("hvv.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="route.css">
</head>
<body>
<main>
  <h1 class="sr">HVV Routenplaner</h1>
  <div class="side">
  <form id="search" class="card" autocomplete="off" novalidate>
    <div class="fields">
      <div class="field" data-which="from">
        <span class="mark from" aria-hidden="true"></span>
        <label class="sr" for="in-from">Start</label>
        <input id="in-from" type="text" role="combobox" aria-expanded="false" aria-controls="list-from" aria-autocomplete="list" aria-haspopup="listbox"
               placeholder="Start: Adresse oder Haltestelle" enterkeyhint="next" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="search">
        <button type="button" class="ico clear" data-act="clear" aria-label="Start löschen" hidden></button>
        <button type="button" class="ico locate" data-act="locate" aria-label="Meinen Standort als Start verwenden"></button>
        <ul id="list-from" class="sugg" role="listbox" aria-label="Vorschläge für den Start" hidden></ul>
      </div>
      <div class="field" data-which="to">
        <svg class="mark to" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/></svg>
        <label class="sr" for="in-to">Ziel</label>
        <input id="in-to" type="text" role="combobox" aria-expanded="false" aria-controls="list-to" aria-autocomplete="list" aria-haspopup="listbox"
               placeholder="Ziel: Adresse oder Haltestelle" enterkeyhint="search" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="search">
        <button type="button" class="ico clear" data-act="clear" aria-label="Ziel löschen" hidden></button>
        <ul id="list-to" class="sugg" role="listbox" aria-label="Vorschläge für das Ziel" hidden></ul>
      </div>
      <button type="button" id="swap" class="swap" aria-label="Start und Ziel tauschen"></button>
    </div>

    <div class="filters">
    <details class="opts flt" id="when-box" hidden>
      <summary><svg class="fi" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71z"/><path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16m7-8A7 7 0 1 1 1 8a7 7 0 0 1 14 0"/></svg><span class="sr">Zeit: </span><b id="when-val">Abfahrt jetzt</b></summary>
      <div class="when">
        <div class="seg" role="radiogroup" aria-label="Zeitbezug">
          <button type="button" role="radio" aria-checked="true" data-arrive="0">Abfahrt</button>
          <button type="button" role="radio" aria-checked="false" data-arrive="1">Ankunft</button>
        </div>
        <input id="when" type="datetime-local" aria-label="Datum und Uhrzeit" required>
        <button type="button" id="now" class="chip-btn">Jetzt</button>
      </div>
    </details>

    <details class="opts flt">
      <summary><svg class="fi" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M1 11.5a.5.5 0 0 0 .5.5h11.793l-3.147 3.146a.5.5 0 0 0 .708.708l4-4a.5.5 0 0 0 0-.708l-4-4a.5.5 0 0 0-.708.708L13.293 11H1.5a.5.5 0 0 0-.5.5m14-7a.5.5 0 0 1-.5.5H2.707l3.147 3.146a.5.5 0 1 1-.708.708l-4-4a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 4H14.5a.5.5 0 0 1 .5.5"/></svg><span class="sr">Umsteigezeit: </span><b id="min-val"></b></summary>
      <label class="mint">
        <span class="hint">Mindestzeit zwischen Ankunft und Abfahrt, inklusive Fußweg. „Nur Fahrplan“ rechnet mit der geplanten Umsteigezeit: Wer genau so viel Verspätung hat, wie Reserve bleibt, verpasst den Anschluss.</span>
        <input id="min" type="range" min="0" max="5" step="1" value="0" aria-describedby="min-val">
      </label>
    </details>

    <details class="opts flt">
      <summary><svg class="fi" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/><path d="m10.97 4.97-.02.022-3.473 4.425-2.093-2.094a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-1.071-1.05"/></svg><span class="sr">Pünktlichkeit: </span><b id="punct-val"></b></summary>
      <label class="mint">
        <span class="hint">Blendet Verbindungen aus, die laut den Messdaten seltener pünktlich am Ziel ankommen (höchstens 3 Minuten Verspätung). Verbindungen ohne Messdaten bleiben sichtbar.</span>
        <input id="punct" type="range" min="0" max="5" step="1" value="0" aria-describedby="punct-val">
      </label>
    </details>
    <button type="button" id="theme" class="theme-btn"></button>
    </div>

    <button id="go" type="submit" class="primary">Verbindungen suchen</button>
  </form>

  <div id="savedbar" class="savedbar" hidden></div>
  </div>

  <p id="status" class="sr" role="status"></p>
  <section id="out" aria-busy="false" aria-label="Verbindungen" tabindex="-1"></section>
  <footer class="foot" id="foot" hidden>Wahrscheinlichkeiten aus den Verspätungen, die dieser Dienst selbst gemessen hat. Zeiten mit Funksymbol sind Echtzeitprognosen.</footer>
</main>
<script src="route.js"></script>
</body>
</html>
